[build]
  command = "pnpm build"
  publish = "dist"

# Firebase Authentication's OAuth helpers must be served on the same branded
# domain configured in src/firebase/client.ts, so Google's consent screen says
# "Continue to qwizzle.4dl.ca" instead of naming the Firebase project. This is a
# transparent proxy (200 rewrite), not a browser redirect. Must come before the
# SPA catch-all, or index.html would swallow it.
[[redirects]]
  from = "/__/auth/*"
  to = "https://qwizzle.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

# SPA: serve index.html for client-routed paths like /e/<share-slug>.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
